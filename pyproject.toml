[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "ai-bill-of-materials-verifier"
version = "0.1.0"
description = "Offline AI Bill of Materials and model artifact integrity/provenance verification"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "Parag Sawant"}]
keywords = ["bill-of-materials", "cyclonedx", "merkle", "provenance", "slsa", "dsse"]
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3.12", "Topic :: Security"]
dependencies = [
  "cryptography>=50.0.0",
  "jsonschema>=4.22",
  "blake3>=1.0; platform_system != 'Windows' or platform_machine != 'ARM64'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.8", "mypy>=1.13", "types-jsonschema>=4"]

[project.scripts]
ai-bill-of-materials-verifier = "ai_bill_of_materials_verifier.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_bill_of_materials_verifier", "bench"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]
"bench/**" = ["S101", "S108"]
"src/ai_bill_of_materials_verifier/corpus.py" = ["S311"]
"src/ai_bill_of_materials_verifier/stats.py" = ["S311"]
"src/ai_bill_of_materials_verifier/verify.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["blake3", "cryptography.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["integration: requires optional external binaries or containers", "blake3: requires blake3 module"]

[tool.coverage.run]
branch = true
source = ["ai_bill_of_materials_verifier"]
omit = ["src/ai_bill_of_materials_verifier/stats.py", "src/ai_bill_of_materials_verifier/_vendor/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
